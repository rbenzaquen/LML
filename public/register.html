<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse | LML Brand Protection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">LML Brand Protection</a>
    <button class="nav-toggle" aria-label="Menú">☰</button>
    <div class="nav-links">
      <a href="/">Inicio</a>
      <a href="/planes">Planes</a>
      <a href="/login">Iniciar sesión</a>
      <a href="/suscribirse" class="btn">Activar protección</a>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <p class="slogan">Protección continua online de tu marca</p>
      <h1>Crear cuenta</h1>
    </div>
  </header>

  <main class="main">
    <div class="auth-card">
      <h2>Registrate para empezar</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="nombre">Nombre y apellido / Razón social</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre o razón social">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
          <div class="form-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="password">Contraseña (mín. 6 caracteres)</label>
          <div style="position: relative;">
            <input type="password" id="password" name="password" required minlength="6" style="padding-right: 2.5rem;">
            <button type="button" id="togglePassword" aria-label="Mostrar contraseña" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-text-light); font-size: 1rem;">👁</button>
          </div>
          <div class="form-error" id="passwordError"></div>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="aceptoTerminos" name="aceptoTerminos" required style="margin-top: 0.3rem;">
            <span>Acepto los <a href="/terminos" target="_blank">Términos y Condiciones</a> y la Política de Privacidad de LML Brand Protection Membership.</span>
          </label>
          <div class="form-error" id="terminosError"></div>
        </div>
        <div class="form-error" id="formError"></div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Registrarme</button>
      </form>
      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        ¿Ya tenés cuenta? <a href="/login">Iniciar sesión</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="firm">Litvin Marzorati Legales</p>
      <p>LML Brand Protection Membership — Vigilancia marcaria Argentina</p>
      <p style="margin-top: 0.5rem;"><a href="/terminos">Términos y Condiciones</a></p>
    </div>
  </footer>

  <script>
    document.querySelector('.nav-toggle')?.addEventListener('click', () => {
      document.querySelector('.nav-links').classList.toggle('open');
    });
    document.getElementById('togglePassword')?.addEventListener('click', () => {
      const pwd = document.getElementById('password');
      const btn = document.getElementById('togglePassword');
      if (pwd.type === 'password') { pwd.type = 'text'; btn.textContent = '🙈'; } else { pwd.type = 'password'; btn.textContent = '👁'; }
    });
  </script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type="submit"]');
      form.querySelectorAll('.form-error').forEach(el => el.textContent = '');
      document.getElementById('formError').textContent = '';

      if (!form.aceptoTerminos.checked) {
        document.getElementById('terminosError').textContent = 'Debés aceptar los Términos y Condiciones';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registrando...';

      try {
        await API.auth.register({
          nombre: form.nombre.value.trim() || undefined,
          email: form.email.value.trim(),
          password: form.password.value,
        });
        window.location.href = '/dashboard';
      } catch (err) {
        document.getElementById('formError').textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Registrarme';
      }
    });
  </script>
</body>
</html>

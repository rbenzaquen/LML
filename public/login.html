<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | LML Brand Protection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="nav">
    <a href="/">Inicio</a>
    <a href="/register">Registrarse</a>
  </nav>

  <header class="hero">
    <div class="container">
      <p class="slogan">Protección continua online de tu marca</p>
      <h1>Iniciar sesión</h1>
    </div>
  </header>

  <main class="main">
    <div class="auth-card">
      <h2>Accedé a tu cuenta</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
          <div class="form-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
          <div class="form-error" id="passwordError"></div>
        </div>
        <div class="form-error" id="formError"></div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Entrar</button>
      </form>
      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        ¿No tenés cuenta? <a href="/register">Registrate</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="firm">Litvin Marzorati Legales</p>
      <p>LML Brand Protection Membership</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type="submit"]');
      form.querySelectorAll('.form-error').forEach(el => el.textContent = '');
      document.getElementById('formError').textContent = '';

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        await API.auth.login({
          email: form.email.value.trim(),
          password: form.password.value,
        });
        window.location.href = '/dashboard';
      } catch (err) {
        document.getElementById('formError').textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
